name: Note-taking Android installable preview

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/installable-android-preview.yml
      - android/**
      - lib/**
      - assets/**
      - pubspec.yaml
      - pubspec.lock
      - test/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: note-taking-android-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Generate native splash resources
        run: dart run flutter_native_splash:create
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub
      - name: Determine preview version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid pubspec version: $VERSION"; exit 1; }
          BUILD_NUMBER=$((20000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          TAG="preview-v${VERSION}-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Build installable Android APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.meta.outputs.version }}" \
            --build-number="${{ steps.meta.outputs.build_number }}"
      - name: Prepare APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk \
            "release-assets/Note-taking-v${{ steps.meta.outputs.version }}-build-${{ steps.meta.outputs.build_number }}.apk"
          cd release-assets
          sha256sum ./*.apk > SHA256SUMS.txt
      - name: Publish installable preview
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Note-taking v${{ steps.meta.outputs.version }} — Installable preview
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            Installable Android preview built from the repository's main branch.

            Signing: uses the Android debug signing identity when no persistent production upload key is configured. It installs directly, but a later preview signed by another runner key may require uninstalling the earlier preview first. This is not a Play Store release.
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
